# Topology production (spec 15-08-2026). Dev tiện nghi nằm ở
# docker-compose.override.yml (compose tự nạp khi chạy local).
x-web-env: &web-env
  APP_ENV: production
  SECRET_KEY: ${SECRET_KEY}
  DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  MAIL_SERVER: ${MAIL_SERVER:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USE_TLS: ${MAIL_USE_TLS:-True}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["flask", "db", "upgrade"]
    environment: *web-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      <<: *web-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Khong co domain that -> phuc vu HTTP :80 (site address hop le cho Caddy)
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # KHÔNG publish 3306 ở base — dev mở 127.0.0.1 qua override
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *default-logging

  db-backup:
    image: mysql:8
    entrypoint: ["bash", "/backup.sh"]
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  alerts:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "scripts.alert_watch"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALERT_INTERVAL_SECONDS: ${ALERT_INTERVAL_SECONDS:-300}
      ALERT_WEB_URL: ${ALERT_WEB_URL:-http://web:8000/healthz}
      ALERT_WEB_FAIL_THRESHOLD: ${ALERT_WEB_FAIL_THRESHOLD:-2}
      ALERT_BACKUP_DIR: ${ALERT_BACKUP_DIR:-/backups}
      ALERT_BACKUP_MAX_AGE_HOURS: ${ALERT_BACKUP_MAX_AGE_HOURS:-26}
      ALERT_DISK_THRESHOLD_PERCENT: ${ALERT_DISK_THRESHOLD_PERCENT:-85}
      ALERT_REPEAT_HOURS: ${ALERT_REPEAT_HOURS:-6}
      ALERT_SUMMARY_HOUR: ${ALERT_SUMMARY_HOUR:-7}
      ALERT_STATE_FILE: ${ALERT_STATE_FILE:-/state/alerts.json}
    volumes:
      - ./backups:/backups:ro
      - alert_state:/state
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  adminer:
    image: adminer
    ports:
      - "127.0.0.1:8080:8080"
    profiles: ["dev"]
    logging: *default-logging

volumes:
  dbdata:
  caddy_data:
  caddy_config:
  alert_state:
