{% extends "layouts/base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-4">
    <h3>Tổng quan</h3>
    <div class="btn-group">
        <a href="/dashboard" class="btn btn-primary active">Thống kê</a>
        <a href="/dashboard/timeline" class="btn btn-outline-primary">Timeline</a>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-3">
        <div class="card border-primary border-start border-4 shadow-sm">
            <div class="card-body">
                <h5 class="text-primary text-uppercase small fw-bold">Doanh thu</h5>
                <h3>{{ stats.revenue }} đ</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-success border-start border-4 shadow-sm">
            <div class="card-body">
                <h5 class="text-success text-uppercase small fw-bold">Phòng trống</h5>
                <h3>{{ stats.available }} / {{ stats.total }}</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-warning border-start border-4 shadow-sm">
            <div class="card-body">
                <h5 class="text-warning text-uppercase small fw-bold">Đang ở</h5>
                <h3>{{ stats.occupied }}</h3>
            </div>
        </div>
    </div>
</div>
{% endblock %}
