{% extends "layouts/base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-4">
    <h3>Sơ đồ phòng (Timeline)</h3>
    <div class="d-flex gap-2">
        {% if user_role == 'admin' %}
        <button class="btn btn-danger" onclick="adminAction()">Admin Tool</button>
        {% endif %}
        <div class="btn-group">
            <a href="/dashboard" class="btn btn-outline-primary">Thống kê</a>
            <a href="/dashboard/timeline" class="btn btn-primary active">Timeline</a>
        </div>
    </div>
</div>

<div class="card shadow">
    <div class="card-body p-0 table-responsive">
        <table class="table table-bordered table-hover text-center mb-0">
            <thead class="table-light">
                <tr id="timeline-header"></tr>
            </thead>
            <tbody id="timeline-body">
                <tr><td colspan="100%" class="p-5">Loading data...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/timeline.js') }}"></script>
{% endblock %}
