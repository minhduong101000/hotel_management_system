<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Luxury Hotel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <aside class="app-sidebar">
        <div class="sidebar-header">
            HOTEL <span style="color:#f39c12">PRO</span>
        </div>
        <ul class="sidebar-menu">
            <li class="menu-item">
                <a href="/dashboard/room-map" class="{{ 'active' if 'room-map' in request.path else '' }}">
                    <i class="fas fa-th"></i> <span>Sơ đồ phòng</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="/dashboard/timeline" class="{{ 'active' if 'timeline' in request.path else '' }}">
                    <i class="fas fa-stream"></i> <span>Timeline</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="#">
                    <i class="fas fa-users"></i> <span>Khách hàng</span>
                </a>
            </li>
            <li class="menu-item">
                <a href="/logout">
                    <i class="fas fa-sign-out-alt"></i> <span>Đăng xuất</span>
                </a>
            </li>
        </ul>
    </aside>

    <main class="app-content">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
