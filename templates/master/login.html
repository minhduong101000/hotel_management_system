<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Master Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:420px"><h1 class="h3">Master Console</h1>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-danger">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="card card-body shadow-sm"><input class="form-control mb-3" name="username" placeholder="Tên đăng nhập" required><input class="form-control mb-3" name="password" type="password" placeholder="Mật khẩu" required><button class="btn btn-dark">Đăng nhập</button></form></main></body></html>
