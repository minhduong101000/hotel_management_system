<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập Master Console</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/master.css') }}"></head><body class="master-login"><main class="master-login__main"><section class="card master-login__card"><div class="card-body p-4"><p class="master-login__brand mb-2">Hotel POS</p><h1 class="h3 fw-bold">Master Console</h1><p class="text-secondary mb-4">Đăng nhập để quản lý các khách sạn trong hệ thống.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-danger" role="alert">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="vstack gap-3"><div><label class="form-label" for="master-username">Tên đăng nhập</label><input id="master-username" class="form-control" name="username" autocomplete="username" required></div><div><label class="form-label" for="master-password">Mật khẩu</label><input id="master-password" class="form-control" name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary w-100">Đăng nhập</button></form></div></section></main></body></html>
