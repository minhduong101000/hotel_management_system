<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Master Console{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/master.css') }}">
</head>
<body class="master-console">
  <nav class="navbar navbar-dark master-nav px-3 px-md-4"><div class="container-fluid master-shell"><a class="navbar-brand fw-bold" href="{{ url_for('master.dashboard') }}">Master Console</a><a class="btn btn-outline-light btn-sm" href="{{ url_for('master.logout') }}">Đăng xuất</a></div></nav>
  <main class="container master-shell py-4">{% block content %}{% endblock %}</main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
