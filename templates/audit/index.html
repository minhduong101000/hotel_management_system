{% extends "layouts/base.html" %}
{% block content %}
<section class="container-fluid py-4 audit-log-page">
  <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4"><div><p class="text-uppercase small fw-semibold text-primary mb-1">Quản trị vận hành</p><h1 class="h3 mb-1">Nhật ký hoạt động</h1><p class="text-secondary mb-0">100 thao tác gần nhất của khách sạn này.</p></div><button id="audit-refresh" class="btn btn-outline-primary" type="button"><i class="fas fa-rotate-right me-2" aria-hidden="true"></i>Làm mới</button></div>
  <div class="card shadow-sm border-0"><div class="card-body border-bottom"><div class="row g-3 align-items-end"><div class="col-md-4"><label for="audit-action" class="form-label">Thao tác</label><input id="audit-action" class="form-control" placeholder="Ví dụ: checkin"></div><div class="col-md-4"><label for="audit-entity" class="form-label">Đối tượng</label><input id="audit-entity" class="form-control" placeholder="Ví dụ: booking_room"></div><div class="col-md-auto"><button id="audit-filter" class="btn btn-primary w-100" type="button">Lọc nhật ký</button></div></div></div><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-light"><tr><th>Thời gian</th><th>Thao tác</th><th>Đối tượng</th><th class="text-end">Chi tiết</th></tr></thead><tbody id="audit-list"><tr><td colspan="4" class="text-center text-secondary py-5">Đang tải nhật ký…</td></tr></tbody></table></div></div>
</section>
{% endblock %}
{% block scripts %}<script>
(()=>{const list=document.getElementById('audit-list'),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){list.innerHTML='<tr><td colspan="4" class="text-center text-secondary py-5">Đang tải nhật ký…</td></tr>';const p=new URLSearchParams(),a=document.getElementById('audit-action').value.trim(),e=document.getElementById('audit-entity').value.trim();if(a)p.set('action',a);if(e)p.set('entity_type',e);try{const r=await fetch(`api/events?${p}`),d=await r.json();if(!r.ok)throw Error('Không thể tải nhật ký.');list.innerHTML=d.items.length?d.items.map(i=>`<tr><td class="text-nowrap">${esc(new Date(i.created_at).toLocaleString('vi-VN'))}</td><td><span class="badge text-bg-primary">${esc(i.action)}</span></td><td>${esc(i.entity_type)} #${esc(i.entity_id)}</td><td class="text-end"><details><summary class="btn btn-sm btn-outline-secondary">Xem dữ liệu</summary><pre class="text-start small mt-2 mb-0">${esc(JSON.stringify({trước:i.before_data,sau:i.after_data},null,2))}</pre></details></td></tr>`).join(''):'<tr><td colspan="4" class="text-center text-secondary py-5">Chưa có dữ liệu phù hợp.</td></tr>'}catch(x){list.innerHTML=`<tr><td colspan="4" class="text-center text-danger py-5" role="alert">${esc(x.message)}</td></tr>`}}document.getElementById('audit-filter').addEventListener('click',load);document.getElementById('audit-refresh').addEventListener('click',load);load()})();
</script>{% endblock %}
