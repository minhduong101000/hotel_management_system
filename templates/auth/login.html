<!DOCTYPE html>
<html>
<head><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#2A3F54;height:100vh;display:flex;align-items:center;justify-content:center;}</style></head>
<body>
<div class="card p-4 shadow" style="width:350px;">
    <h3 class="text-center mb-4 text-secondary">LOGIN SYSTEM</h3>
    <form method="POST">
        <input type="text" name="username" class="form-control mb-3" placeholder="admin" required>
        <input type="password" name="password" class="form-control mb-3" placeholder="123456" required>
        <button class="btn btn-primary w-100 fw-bold">ĐĂNG NHẬP</button>
    </form>
</div></body></html>
