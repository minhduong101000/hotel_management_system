{% extends "layouts/base.html" %}

{% block content %}
<style>
    body { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); }
    .navbar { display: none; } /* Ẩn menu đi */
</style>

<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card shadow-lg p-4 border-0" style="width: 400px; border-radius: 20px; background: rgba(255,255,255,0.95);">
        <div class="card-body">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; font-size: 24px;">
                    <i class="fas fa-hotel"></i>
                </div>
                <h4 class="fw-bold text-dark">Welcome Back!</h4>
                <p class="text-muted small">Vui lòng đăng nhập để quản lý</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, msg in messages %}
                        <div class="alert alert-{{ category }} rounded-3">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">USERNAME</label>
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-light"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" name="username" class="form-control border-0 bg-light py-2" placeholder="Nhập tài khoản" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold small text-muted">PASSWORD</label>
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-light"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-0 bg-light py-2" placeholder="Nhập mật khẩu" required>
                    </div>
                </div>
                <button class="btn btn-primary w-100 py-2 shadow-sm fw-bold">ĐĂNG NHẬP</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
