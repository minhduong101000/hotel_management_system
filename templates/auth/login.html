<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - HotelPOS</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="login-page">

    <div class="login-card">
        <div class="login-header">
            <div style="font-size: 40px; color: #2980b9; margin-bottom: 10px;">
                <i class="fa-solid fa-hotel"></i>
            </div>
            <h2>HOTEL POS</h2>
            <p>Hệ thống quản lý khách sạn chuyên nghiệp</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category == 'error' else category }}" role="alert">
                <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="input-group">
                <label for="username">Tên đăng nhập</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                    <input type="text" id="username" name="username" required placeholder="Nhập username..." autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock" aria-hidden="true"></i>
                    <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu..." autocomplete="current-password">
                </div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" name="remember" id="remember">
                <label for="remember">Ghi nhớ đăng nhập</label>
            </div>

            <button type="submit" class="btn-login">
                ĐĂNG NHẬP <i class="fa-solid fa-arrow-right-to-bracket" style="margin-left: 5px;"></i>
            </button>
        </form>
        
        <div style="margin-top: 20px; font-size: 12px; color: #aaa;">
            &copy; 2026 Hotel Management System
        </div>
    </div>

</body>
</html>
