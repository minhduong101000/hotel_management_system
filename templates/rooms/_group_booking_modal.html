<div class="modal fade" id="groupBookingModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered workflow-modal workflow-modal--wide pos-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title">Đặt phòng theo đoàn</h5>
                    <div class="pos-subtitle">Chọn khoảng ngày, tìm phòng trống rồi gán cho đoàn</div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng modal đặt phòng theo đoàn"></button>
            </div>

            <div class="modal-body px-4 py-3">
                <form id="groupBookingForm">
                    <div class="row g-3 align-items-end mb-3">
                        <div class="col-md-5">
                            <label class="pos-label" for="g_check_in">Nhận phòng · 14:00</label>
                            <div class="input-group">
                                <input type="date" class="form-control" id="g_check_in" name="check_in" required>
                                <span class="input-group-text bg-light text-muted small fw-bold">14:00</span>
                            </div>
                        </div>
                        <div class="col-md-5">
                            <label class="pos-label" for="g_check_out">Trả phòng · 12:00</label>
                            <div class="input-group">
                                <input type="date" class="form-control" id="g_check_out" name="check_out" required>
                                <span class="input-group-text bg-light text-muted small fw-bold">12:00</span>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn w-100 fw-bold pos-dark-btn" onclick="searchRoomsForGroup()">
                                <i class="fas fa-search me-1" aria-hidden="true"></i>Tìm phòng
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-baseline mb-2">
                        <span class="pos-section-label">Phòng trống · <span id="availCount">0</span></span>
                        <span class="small fw-bold" id="group-selection-summary" style="color: var(--color-action);"></span>
                    </div>
                    <div class="border rounded-3 bg-white p-2 mb-3" style="max-height: 240px; overflow-y: auto;" id="roomSelectionList">
                        <div class="text-center text-muted py-5">
                            <i class="fas fa-arrow-up" aria-hidden="true"></i><br>Vui lòng chọn ngày và bấm "Tìm phòng"
                        </div>
                    </div>

                    <hr class="pos-divider">

                    <div class="pos-section-label mb-2">Trưởng đoàn</div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="pos-label" for="group_phone">Số điện thoại <span class="text-danger" aria-hidden="true">*</span></label>
                            <input type="text" class="form-control" name="group_phone" id="group_phone" required autocomplete="off" placeholder="Nhập SĐT...">
                        </div>
                        <div class="col-md-4">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="pos-label mb-0" for="group_name">Họ và tên <span class="text-danger" aria-hidden="true">*</span></label>
                                <button type="button" class="pos-link-btn" onclick="openQRScanner('group')">
                                    <i class="fas fa-qrcode me-1" aria-hidden="true"></i>Quét QR CCCD
                                </button>
                            </div>
                            <input type="text" class="form-control mt-1" name="group_name" id="group_name" required autocomplete="off" placeholder="Tên trưởng đoàn...">
                        </div>
                        <div class="col-md-4">
                            <label class="pos-label" for="group_cccd">Số CCCD</label>
                            <input type="text" class="form-control" name="group_cccd" id="group_cccd" autocomplete="off" placeholder="Số CCCD...">
                        </div>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-12">
                            <label class="pos-label" for="group_address">Địa chỉ cư trú</label>
                            <input type="text" class="form-control" name="group_address" id="group_address" autocomplete="off" placeholder="Địa chỉ thường trú / tạm trú...">
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="pos-label" for="group_total_deposit">Tiền cọc tổng (VNĐ)</label>
                            <div class="d-flex gap-2">
                                <input type="number" class="form-control fw-bold" name="total_deposit" id="group_total_deposit" placeholder="0">
                                <button class="pos-chip flex-none" type="button" onclick="calculateGroupQuickDeposit(0.5)">50%</button>
                                <button class="pos-chip flex-none" type="button" onclick="calculateGroupQuickDeposit(1)">100%</button>
                            </div>
                            <small class="text-muted d-block mt-1" id="group-deposit-hint"></small>
                            <div class="d-flex gap-2 mt-2" role="group" aria-label="Phương thức nhận cọc đoàn">
                                <button type="button" class="pos-method-btn active" data-method="cash" onclick="setDepositPaymentMethod('cash', this, 'group-deposit-method')">Tiền mặt</button>
                                <button type="button" class="pos-method-btn" data-method="banking" onclick="setDepositPaymentMethod('banking', this, 'group-deposit-method')">Chuyển khoản</button>
                                <button type="button" class="pos-method-btn" data-method="credit_card" onclick="setDepositPaymentMethod('credit_card', this, 'group-deposit-method')">Thẻ</button>
                            </div>
                            <input type="hidden" id="group-deposit-method" value="cash">
                        </div>
                        <div class="col-md-6">
                            <label class="pos-label" for="group_note">Ghi chú</label>
                            <input type="text" class="form-control" name="note" id="group_note" placeholder="VD: Đoàn công ty..." autocomplete="off">
                        </div>
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Đóng</button>
                <button type="button" class="btn btn-primary fw-bold px-4" onclick="submitGroupBooking()">
                    <i class="fas fa-check-circle me-2" aria-hidden="true"></i>Xác nhận đặt
                </button>
            </div>
        </div>
    </div>
</div>
