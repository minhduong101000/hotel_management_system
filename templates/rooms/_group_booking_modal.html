<div class="modal fade" id="groupBookingModal" tabindex="-1">
    <div class="modal-dialog modal-lg workflow-modal workflow-modal--fullscreen">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="fas fa-users"></i> ĐẶT PHÒNG THEO ĐOÀN</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Đóng modal đặt phòng theo đoàn"></button>
            </div>
            
            <div class="modal-body bg-light">
                <form id="groupBookingForm">
                    <div class="card border-0 shadow-sm p-3 mb-3">
                        <h6 class="text-success fw-bold mb-2">1. Thời gian lưu trú</h6>
                        <div class="row g-2 align-items-end">
                            <div class="col-md-5">
                                <label class="small fw-bold text-muted" for="g_check_in">Check-in (Mặc định 14:00)</label>
                                <div class="input-group">
                                    <input type="date" class="form-control" id="g_check_in" name="check_in" required>
                                    <span class="input-group-text bg-light text-muted small fw-bold">14:00</span>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label class="small fw-bold text-muted" for="g_check_out">Check-out (Mặc định 12:00)</label>
                                <div class="input-group">
                                    <input type="date" class="form-control" id="g_check_out" name="check_out" required>
                                    <span class="input-group-text bg-light text-muted small fw-bold">12:00</span>
                                </div>
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-primary w-100" onclick="searchRoomsForGroup()">
                                    <i class="fas fa-search"></i> Tìm
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">2. Chọn phòng trống (<span id="availCount">0</span> phòng):</label>
                        <div class="border p-2 rounded bg-white shadow-sm" style="height: 200px; overflow-y: auto;" id="roomSelectionList">
                            <div class="text-center text-muted mt-5">
                                <i class="fas fa-arrow-up"></i><br>Vui lòng chọn ngày và bấm "Tìm"
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm p-4 mb-3 rounded-4 bg-white">
                         <h6 class="text-success fw-bold mb-3 border-bottom pb-2">
                             <i class="fas fa-user-tie me-2"></i>Thông tin Trưởng đoàn
                         </h6>
                         <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-secondary mb-1" for="group_phone">Số điện thoại <span class="text-danger">*</span></label>
                                <input type="text" class="form-control shadow-sm border-secondary-subtle" name="group_phone" id="group_phone" required autocomplete="off" placeholder="Nhập SĐT...">
                            </div>
                            <div class="col-md-4">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label class="form-label small mb-0 fw-bold text-secondary" for="group_name">Trưởng đoàn <span class="text-danger">*</span></label>
                                    <button type="button" class="btn btn-xs btn-outline-success border-0 py-0 px-2 fw-bold" style="font-size: 0.75rem;" onclick="openQRScanner('group')">
                                        <i class="fas fa-qrcode me-1"></i>QUÉT QR
                                    </button>
                                </div>
                                <input type="text" class="form-control shadow-sm border-secondary-subtle" name="group_name" id="group_name" required autocomplete="off" placeholder="Tên trưởng đoàn...">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold text-secondary mb-1" for="group_cccd">Số CCCD</label>
                                <input type="text" class="form-control shadow-sm border-secondary-subtle" name="group_cccd" id="group_cccd" autocomplete="off" placeholder="Số CCCD...">
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-12">
                                <label class="form-label small fw-bold text-secondary mb-1" for="group_address">Địa chỉ cư trú</label>
                                <input type="text" class="form-control shadow-sm border-secondary-subtle" name="group_address" id="group_address" autocomplete="off" placeholder="Địa chỉ thường trú / tạm trú...">
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col-md-6">
                                <label class="form-label small" for="group_total_deposit">Tiền cọc Tổng (VND)</label>
                                <div class="input-group">
                                    <input type="number" class="form-control fw-bold text-danger" name="total_deposit" id="group_total_deposit" placeholder="0">
                                    <button class="btn btn-outline-danger" type="button" onclick="calculateGroupQuickDeposit(0.5)">50%</button>
                                    <button class="btn btn-outline-danger" type="button" onclick="calculateGroupQuickDeposit(1)">100%</button>
                                </div>
                                <small class="text-muted" id="group-deposit-hint" style="font-size: 0.75rem;"></small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small" for="group_note">Ghi chú</label>
                                <input type="text" class="form-control" name="note" id="group_note" placeholder="VD: Đoàn công ty..." autocomplete="off">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button type="button" class="btn btn-success fw-bold px-4" onclick="submitGroupBooking()">
                    <i class="fas fa-check-circle me-2"></i> XÁC NHẬN ĐẶT
                </button>
            </div>
        </div>
    </div>
</div>
