<div
    class="modal fade"
    id="groupCheckoutModal"
    tabindex="-1"
    aria-hidden="true"
    aria-labelledby="groupCheckoutModalLabel"
>
    <div class="modal-dialog modal-lg modal-dialog-centered workflow-modal pos-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="groupCheckoutModalLabel" tabindex="-1" data-modal-initial-focus>Hóa đơn đoàn · <span id="gc-booking-code" class="pos-title-accent">...</span></h5>
                    <div class="pos-subtitle">Trưởng đoàn: <span id="gc-customer-name">...</span></div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng hóa đơn đoàn"></button>
            </div>
            <div class="modal-body px-4 py-3">
                <div
                    id="gc-checkout-status"
                    class="alert alert-info py-2 d-none"
                    role="status"
                    aria-live="polite"
                ></div>

                <div class="table-responsive">
                    <table class="table align-middle mb-0 pos-line-table">
                        <thead>
                            <tr>
                                <th class="text-start">Phòng</th>
                                <th class="text-end">Tiền phòng</th>
                                <th class="text-end">Dịch vụ</th>
                                <th class="text-end">Phụ thu</th>
                                <th class="text-end">Tổng</th>
                            </tr>
                        </thead>
                        <tbody id="gc-room-list"></tbody>
                    </table>
                </div>

                <div class="pos-total-box mt-3">
                    <div class="d-flex justify-content-between">
                        <span class="text-muted" style="font-size: 13.5px;">Tổng phòng &amp; dịch vụ</span>
                        <span id="gc-grand-total" class="fw-bold">0 đ</span>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <div class="form-check form-switch m-0">
                            <input class="form-check-input" type="checkbox" id="gc-tax-toggle">
                            <label class="form-check-label" for="gc-tax-toggle" style="font-size: 13.5px;">Thuế VAT 8%</label>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <span id="gc-tax-status" class="small text-muted">Đang tắt</span>
                            <span id="gc-tax-amount" class="fw-bold" style="font-size: 13.5px;">0 đ</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-2 text-danger" style="font-size: 13.5px;">
                        <span>Đã đặt cọc</span>
                        <span id="gc-deposit" class="fw-bold">- 0 đ</span>
                    </div>

                    <div class="pos-summary-divider"></div>

                    <div class="d-flex justify-content-between align-items-baseline">
                        <span id="gc-payment-label" class="fw-bold" style="font-size: 14px;">Đoàn cần trả</span>
                        <span id="gc-final-total" class="pos-grand-due">0 đ</span>
                    </div>
                </div>

                <div class="d-flex gap-2 mt-3" role="group" aria-label="Phương thức thanh toán đoàn">
                    <button type="button" class="pos-method-btn active" data-method="cash" onclick="setCheckoutPaymentMethod('cash', this, 'gc-payment-method')">Tiền mặt</button>
                    <button type="button" class="pos-method-btn" data-method="banking" onclick="setCheckoutPaymentMethod('banking', this, 'gc-payment-method')">Chuyển khoản</button>
                    <button type="button" class="pos-method-btn" data-method="credit_card" onclick="setCheckoutPaymentMethod('credit_card', this, 'gc-payment-method')">Thẻ</button>
                </div>
                <input type="hidden" id="gc-payment-method" value="cash">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                <button
                    type="button"
                    class="btn btn-primary fw-bold"
                    data-role="group-checkout-confirm"
                    aria-busy="false"
                    aria-describedby="gc-checkout-status"
                    onclick="submitGroupCheckout()"
                >
                    <i class="fas fa-check-circle me-1" aria-hidden="true"></i>Xác nhận thanh toán đoàn
                </button>
            </div>
        </div>
    </div>
</div>
