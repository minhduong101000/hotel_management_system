<div
    class="modal fade"
    id="groupCheckoutModal"
    tabindex="-1"
    aria-hidden="true"
    aria-labelledby="groupCheckoutModalLabel"
>
    <div class="modal-dialog modal-lg workflow-modal workflow-modal--fullscreen">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title fw-bold" id="groupCheckoutModalLabel"><i class="fas fa-users"></i> HÓA ĐƠN ĐOÀN: <span id="gc-booking-code">...</span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Đóng hóa đơn đoàn"></button>
            </div>
            <div class="modal-body">
                <div
                    id="gc-checkout-status"
                    class="alert alert-info py-2 d-none"
                    role="status"
                    aria-live="polite"
                ></div>
                <p><strong>Khách hàng:</strong> <span id="gc-customer-name">...</span></p>
                
                <table class="table table-bordered mt-3 text-center align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="text-start">Phòng</th>
                            <th class="text-end">Tiền phòng</th>
                            <th class="text-end">Tiền dịch vụ</th>
                            <th class="text-end">Phụ thu</th>
                            <th class="text-end fw-bold">Tổng cộng</th>
                        </tr>
                    </thead>
                    <tbody id="gc-room-list">
                        </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4" class="fw-bold text-end text-muted">TỔNG TIỀN PHÒNG & DỊCH VỤ:</td>
                            <td class="fw-bold text-end" id="gc-grand-total">0 đ</td>
                        </tr>
                        <tr>
                            <td colspan="4" class="fw-bold text-end text-primary">
                                <div class="d-inline-flex align-items-center gap-2">
                                    <span>THUẾ VAT (8%):</span>
                                    <div class="form-check form-switch m-0">
                                        <input class="form-check-input" type="checkbox" id="gc-tax-toggle">
                                        <label class="form-check-label small" for="gc-tax-toggle">Bật</label>
                                    </div>
                                    <span id="gc-tax-status" class="small text-muted">Đang tắt</span>
                                </div>
                            </td>
                            <td class="fw-bold text-end text-primary" id="gc-tax-amount">0 đ</td>
                        </tr>
                        <tr>
                            <td colspan="4" class="fw-bold text-end text-danger">ĐÃ ĐẶT CỌC:</td>
                            <td class="fw-bold text-end text-danger" id="gc-deposit">- 0 đ</td>
                        </tr>
                        <tr class="bg-light">
                            <td colspan="4" class="fw-bold fs-5 text-end" id="gc-payment-label">KHÁCH CẦN TRẢ:</td>
                            <td class="fw-bold fs-4 text-end text-success" id="gc-final-total">0 đ</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy bỏ</button>
                <button
                    type="button"
                    class="btn btn-success fw-bold"
                    data-role="group-checkout-confirm"
                    aria-busy="false"
                    aria-describedby="gc-checkout-status"
                    onclick="submitGroupCheckout()"
                >
                    <i class="fas fa-check-circle"></i> XÁC NHẬN THANH TOÁN ĐOÀN
                </button>
            </div>
        </div>
    </div>
</div>
